name: Fix v0.4.3 prompt-mode review issue

on:
  push:
    branches:
      - feature/v0.4.3-prompt-mode

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.4.3-prompt-mode
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply review fix and regression tests
        env:
          TEST_ADDITION_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import os

          source_path = Path("src/vocal_more/core/text_polisher.py")
          source = source_path.read_text(encoding="utf-8")
          old = (
              "    if llm_config.structured:\n"
              "        structured = _prompt_instruction(llm_config, \"structured\", STRUCTURED_INSTRUCTIONS)\n"
              "        blocks.append(f\"结构化格式要求：\\n{structured}\")\n"
              "    return \"\\n\\n\".join(blocks)\n"
          )
          new = (
              "    structured_override = (\n"
              "        _active_prompt_override(llm_config, \"structured\")\n"
              "        if llm_config.structured\n"
              "        else None\n"
              "    )\n"
              "    if structured_override:\n"
              "        blocks.append(f\"结构化格式要求：\\n{structured_override}\")\n"
              "    return \"\\n\\n\".join(blocks)\n"
          )
          if source.count(old) != 1:
              raise SystemExit("expected one prompt-mode structured block")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          tests_path = Path("tests/test_text_polisher.py")
          tests = tests_path.read_text(encoding="utf-8")
          marker = "def test_prompt_mode_ignores_legacy_structured_default():"
          if marker not in tests:
              addition = base64.b64decode(os.environ["TEST_ADDITION_B64"]).decode("utf-8")
              tests_path.write_text(tests + addition, encoding="utf-8")
          PY
          python -m compileall -q src tests

      - name: Run prompt-mode tests
        env:
          DASHSCOPE_API_KEY: test-api-key
          PYTHONUNBUFFERED: "1"
        run: |
          uv sync --group dev
          uv run python -m pytest -q tests/test_text_polisher.py tests/test_prompt_coach.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocal_more/core/text_polisher.py tests/test_text_polisher.py
          git diff --cached --check
          git commit -m "fix: isolate prompt mode from dictation structure rules"
          git push origin HEAD:feature/v0.4.3-prompt-mode
