name: Materialize Windows desktop phase 2

on:
  push:
    branches:
      - codex/windows-desktop-mvp

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/windows-desktop-mvp

      - name: Materialize capsule, settings, and installer sources
        shell: bash
        run: |
          set -euo pipefail
          cat .phase2-bootstrap/chunk-* | base64 --decode > /tmp/vm-phase2.tar.gz
          actual_sha="$(sha256sum /tmp/vm-phase2.tar.gz | awk '{print $1}')"
          expected_sha="b640a1341183106fd0d8d9010583fb89f48d7e3032c9b018a0677552445898"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Phase 2 archive checksum mismatch: $actual_sha" >&2
            exit 1
          fi
          tar -xzf /tmp/vm-phase2.tar.gz -C .
          rm -rf .phase2-bootstrap .windows-gui-bootstrap
          python -m compileall -q src packaging/windows tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Windows capsule settings and installer"
          git push origin HEAD:codex/windows-desktop-mvp
