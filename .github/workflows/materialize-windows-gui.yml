name: Materialize Windows GUI

on:
  push:
    branches:
      - codex/windows-desktop-mvp

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/windows-desktop-mvp

      - name: Decode, validate, and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .windows-gui-bootstrap/chunk-* | tr -d '\n' | base64 --decode > /tmp/windows-gui.tar.gz
          echo 'cb888b4af898be84e69c42617444754c6a46b31636338236552529cfc90bba03  /tmp/windows-gui.tar.gz' | sha256sum --check
          tar -xzf /tmp/windows-gui.tar.gz -C .
          rm -rf .windows-gui-bootstrap
          python -m compileall -q src packaging/windows tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Windows capsule settings and installer'
          git push origin HEAD:codex/windows-desktop-mvp
