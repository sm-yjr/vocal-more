name: Finalize v0.4.4 Prompt regressions

on:
  push:
    branches:
      - fix/v0.4.4-prompt-mode

permissions:
  contents: write

jobs:
  implement-test-and-commit:
    runs-on: macos-latest
    env:
      DASHSCOPE_API_KEY: test-api-key
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.4.4-prompt-mode
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply v0.4.4 implementation and regression corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          runner = Path(".github/workflows/prepare-v044-runner7.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = (
              "\n          PY\n\n"
              "      - name: Refresh editable project metadata in lockfile"
          )
          start = runner.index(start_marker) + len(start_marker)
          end = runner.index(end_marker, start)
          implementation = textwrap.dedent(runner[start:end])
          exec(compile(implementation, "prepare-v044-runner7-apply.py", "exec"))

          coach_path = Path("src/vocal_more/domain/prompt_coach.py")
          coach = coach_path.read_text(encoding="utf-8")
          vague_old = (
              'r"(?:优化|修改|修复|完善)(?:一下)?'
              '(?:现有|当前|这个)?项目|"'
          )
          vague_new = (
              'r"(?:优化|修改|修复|完善)(?:一下)?'
              '(?:现有|当前|这个|该|已有)?(?:的)?'
              '(?:项目|代码库|仓库|意图库)|"'
          )
          if coach.count(vague_old) != 1:
              raise RuntimeError("vague project pattern not found exactly once")
          coach = coach.replace(vague_old, vague_new, 1)

          version_old = 'r"版本(?:号)?\\s*[:：]?\\s*[\\w.-]+)",'
          version_new = (
              'r"版本(?:号)?\\s*[:：]?\\s*'
              'v?\\d+(?:\\.\\d+){1,3})",'
          )
          if coach.count(version_old) != 1:
              raise RuntimeError("version identifier pattern not found exactly once")
          coach = coach.replace(version_old, version_new, 1)
          coach_path.write_text(coach, encoding="utf-8")

          tests_path = Path("tests/test_text_polisher.py")
          tests = tests_path.read_text(encoding="utf-8")
          phrase_old = 'assert "仅在相关时加入" in prompt'
          phrase_new = 'assert "只在用户提供相关信息时加入" in prompt'
          if tests.count(phrase_old) != 1:
              raise RuntimeError("optional section expectation not found exactly once")
          tests = tests.replace(phrase_old, phrase_new, 1)

          route_old = 'assert "把口语化输入转换成任务式 Prompt" in '
          route_new = 'assert "转换成可直接发送给 Agent 的 Prompt" in '
          if tests.count(route_old) != 2:
              raise RuntimeError(
                  f"expected two legacy route assertions, found {tests.count(route_old)}"
              )
          tests = tests.replace(route_old, route_new)

          tests = tests.replace(
              "def test_prompt_mode_applies_explicit_structured_override():",
              "def test_prompt_mode_ignores_structured_override():",
              1,
          )
          structured_old = '''    assert marker in build_polish_system_prompt(config)
              assert marker in build_omni_inline_polish_instructions(config)
          '''
          structured_new = '''    assert marker not in build_polish_system_prompt(config)
              assert marker not in build_omni_inline_polish_instructions(config)
          '''
          structured_old = textwrap.dedent(structured_old)
          structured_new = textwrap.dedent(structured_new)
          if tests.count(structured_old) != 1:
              raise RuntimeError("structured override assertions not found exactly once")
          tests = tests.replace(structured_old, structured_new, 1)
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Refresh editable project metadata in lockfile
        run: uv lock

      - name: Install locked development dependencies
        run: uv sync --locked --group dev

      - name: Run focused Prompt Mode regressions
        run: |
          uv run python -m pytest -q \
            tests/test_prompt_coach.py \
            tests/test_text_polisher.py \
            tests/test_dictation_workflow.py \
            tests/test_floating_capsule_prompt.py

      - name: Run full macOS test suite
        run: uv run python -m pytest -q

      - name: Check patch integrity
        run: |
          git diff --check
          git status --short

      - name: Commit tested v0.4.4 branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v044*.yml
          git config user.name "sm-yjr"
          git config user.email "76152255+sm-yjr@users.noreply.github.com"
          git add -A
          git commit -m "[macOS-only] fix: isolate Prompt Mode and improve clarification UI"
          git push origin HEAD:fix/v0.4.4-prompt-mode
