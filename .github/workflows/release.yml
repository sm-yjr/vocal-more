name: Release DMG
on:
  push:
    tags:
    - v*.*.*
    - '*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish or resume
        required: true
        type: string
      mode:
        description: Candidate selection policy
        type: choice
        default: auto
        options:
        - auto
        - require-ready
        - rebuild
permissions:
  contents: read
  actions: read
concurrency:
  group: vocal-more-release-publication
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      route: ${{ steps.resolve.outputs.route }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
    - name: Check out exact source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_tag || github.ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve exact candidate or fallback
      id: resolve
      env:
        RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        MODE: ${{ inputs.mode || 'auto' }}
      run: python3 packaging/release_cli.py resolve --tag "$RELEASE_TAG" --mode "$MODE"
  prepare:
    needs: resolve
    if: needs.resolve.outputs.route == 'full' || needs.resolve.outputs.route == 'refresh'
    uses: ./.github/workflows/_release-candidate.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      release_tag: ${{ needs.resolve.outputs.release_tag }}
      refresh_artifact_id: ${{ needs.resolve.outputs.route == 'refresh' && needs.resolve.outputs.artifact_id || '0' }}
    secrets: inherit
  publish:
    needs:
    - resolve
    - prepare
    if: ${{ always() && needs.resolve.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result ==
      'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      ROUTE: ${{ needs.resolve.outputs.route }}
      ROUTE_REASON: ${{ needs.resolve.outputs.reason }}
      CANDIDATE_ID: ${{ needs.prepare.outputs.artifact_id || needs.resolve.outputs.artifact_id }}
    steps:
    - name: Record publication start
      run: echo "PUBLISH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - name: Check out exact source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.resolve.outputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Fetch verified candidate
      run: |-
        args=()
        if [[ "$ROUTE" == "resume" ]]; then
          args+=(--published)
        else
          args+=(--artifact-id "$CANDIDATE_ID")
          if [[ "$ROUTE" == "full" || "$ROUTE" == "refresh" ]]; then
            args+=(--current-run "$GITHUB_RUN_ID")
          fi
        fi
        python3 packaging/release_cli.py fetch --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --directory "$RUNNER_TEMP/candidate" "${args[@]}"
    - name: Stage and verify GitHub Release assets
      run: python3 packaging/release_cli.py stage --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --directory "$RUNNER_TEMP/candidate"
        --backup "$RUNNER_TEMP/release-backup"
    - name: Persist feed recovery checkpoint
      uses: actions/upload-artifact@v4
      with:
        name: release-backup-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/release-backup/*
        if-no-files-found: error
        retention-days: 30
    - name: Publish release and signed channel feed
      run: python3 packaging/release_cli.py commit --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --directory "$RUNNER_TEMP/candidate"
    - name: Save publication receipt
      uses: actions/upload-artifact@v4
      with:
        name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
        path: release-receipt.json
        if-no-files-found: error
        retention-days: 90
