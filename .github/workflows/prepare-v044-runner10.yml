name: Complete v0.4.4 macOS validation

on:
  push:
    branches:
      - fix/v0.4.4-prompt-mode

permissions:
  contents: write

jobs:
  implement-test-and-commit:
    runs-on: macos-latest
    env:
      DASHSCOPE_API_KEY: test-api-key
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.4.4-prompt-mode
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/settings/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply final v0.4.4 implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          runner = Path(".github/workflows/prepare-v044-runner9.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = (
              "\n          PY\n\n"
              "      - name: Refresh editable project metadata in lockfile"
          )
          start = runner.index(start_marker) + len(start_marker)
          end = runner.index(end_marker, start)
          implementation = textwrap.dedent(runner[start:end])
          exec(compile(implementation, "prepare-v044-runner9-apply.py", "exec"))

          path = Path("src/vocal_more/core/text_polisher.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "4. 信息仍不完整时，基于已有内容生成最强可用版本并省略缺失字段；"
              "不要虚构问题、占位符、答案、业务事实、偏好、数据或技术结论"
          )
          new = (
              "4. 不要补充用户没有说出的业务事实。信息仍不完整时，"
              "基于已有内容生成最强可用版本并省略缺失字段；"
              "不要虚构问题、占位符、答案、偏好、数据或技术结论"
          )
          if text.count(old) != 1:
              raise RuntimeError(
                  f"Prompt fact-protection rule expected once, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Refresh editable project metadata in lockfile
        run: uv lock

      - name: Install Python and frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --group dev &
          python_pid=$!
          npm --prefix frontend/settings ci &
          frontend_pid=$!
          status=0
          wait "$python_pid" || status=$?
          wait "$frontend_pid" || status=$?
          exit "$status"

      - name: Run focused Prompt Mode regressions
        run: |
          uv run python -m pytest -q \
            tests/test_prompt_coach.py \
            tests/test_text_polisher.py \
            tests/test_dictation_workflow.py \
            tests/test_floating_capsule_prompt.py

      - name: Run full macOS Python suite
        run: uv run python -m pytest -q

      - name: Run frontend checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend/settings test
          npm --prefix frontend/settings run typecheck
          npm --prefix frontend/settings run lint
          npm --prefix frontend/settings run build

      - name: Check patch integrity
        run: |
          git diff --check
          git status --short

      - name: Commit tested v0.4.4 branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v044*.yml
          git config user.name "sm-yjr"
          git config user.email "76152255+sm-yjr@users.noreply.github.com"
          git add -A
          git commit -m "[macOS-only] fix: isolate Prompt Mode and improve clarification UI"
          git push origin HEAD:fix/v0.4.4-prompt-mode
