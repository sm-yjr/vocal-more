          本版本修复 0.4.3 提示词模式首次实用测试暴露出的四类边界问题。

          ## Prompt 编译器与润色模块彻底隔离

          Prompt 模式不再接收或输出前台 App 类别、终端/开发场景、润色强度、语气、人设、结构化格式等普通听写配置。用户没有口述的“终端环境”“格式保护”等内容不会再进入最终 Prompt。

          ## 词典仅用于识别纠错

          用户词典不再作为 Prompt 编译上下文发送给模型。标准词仍可通过 ASR corpus 和本地 alias normalization 完成纠错，但词典条目、别名、校准说明和“专有名词修正”规则不会出现在最终 Prompt 中。

          ## 澄清问题回到录音阶段

          最终 Prompt 不再生成 `Open questions`、待确认或澄清问题章节。信息缺口改由录音中的本地提示词教练直接询问用户，最多同时显示两条问题。针对“优化现有项目、生成 3–4 个部分”这类输入，会分别询问项目代码库/路径/版本和其余构成部分。

          所有 Prompt 输出在粘贴前还会经过确定性清洗；该清洗同时覆盖独立 LLM 润色和 Omni inline 两条链路。

          ## macOS 胶囊可完整显示问题

          Prompt 模式使用独立的 360×152 悬浮面板。提示区域支持换行、两行问题和自然断词，不再使用单行省略号截断。普通听写胶囊仍保持原来的紧凑尺寸。

          ## 发布范围

          0.4.4 仅在 macOS 上测试和发布。Pull Request 和 merge commit 标题使用 `[macOS-only]` 标记时，Windows workflow 会跳过；正式发布继续使用现有 macOS 签名、公证、stapling、DMG、GitHub Release 和 Sparkle appcast 流程。
