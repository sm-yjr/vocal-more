name: Apply v0.4.3 Prompt mode patch

on:
  push:
    branches:
      - feature/v0.4.3-prompt-mode

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.4.3-prompt-mode
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Decode and apply patch
        env:
          PATCH_B64: ""
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import os

          target = Path("scripts/apply_v043.py")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(gzip.decompress(base64.b64decode(os.environ["PATCH_B64"])))
          PY
          python scripts/apply_v043.py
          uv lock
          python -m compileall -q src tests

      - name: Run focused tests
        env:
          DASHSCOPE_API_KEY: test-api-key
          PYTHONUNBUFFERED: "1"
        run: |
          uv sync --group dev
          uv run python -m pytest -q tests/test_prompt_coach.py tests/test_text_polisher.py tests/test_streaming_paste.py tests/test_windows_desktop_ui.py

      - name: Commit implementation
        run: |
          rm -f scripts/apply_v043.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add guided prompt input mode"
          git push origin HEAD:feature/v0.4.3-prompt-mode
