<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 12px;
}

.capsule {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  border-radius: 17px;
  background: rgba(0, 0, 0, 1);
  border: 1px solid rgba(255, 255, 255, 0.32);
  box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.15), 0px 25px 30px rgba(0, 0, 0, 0.25);
  padding: 0 12px;
  gap: 0;
  opacity: 0;
  transform: translateY(10px) scale(0.95);
  transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1),
              transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
              width 0.25s cubic-bezier(0.4, 0, 0.2, 1),
              min-height 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}

.capsule-row {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 34px;
}

.streaming-text {
  display: none;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.6);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding-bottom: 8px;
}

.capsule.has-streaming-text.state-processing .streaming-text {
  display: block;
}

.capsule.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

/* Waveform bars */
.waveform {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 20px;
}

.waveform .bar {
  width: 2px;
  min-height: 2px;
  max-height: 20px;
  height: 2px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 1px;
  /* No CSS transition — JS rAF handles smooth animation */
}

/* Buttons for hands-free mode */
.capsule-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  transition: background 0.15s ease, transform 0.1s ease;
  -webkit-app-region: no-drag;
}

.capsule-btn:active {
  transform: scale(0.9);
}

.btn-cancel {
  background: rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.8);
  margin-right: 8px;
}
.btn-cancel:hover { background: rgba(255, 59, 48, 0.6); }

.btn-finish {
  background: rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.8);
  margin-left: 8px;
}
.btn-finish:hover { background: rgba(52, 199, 89, 0.6); }

/* Hands-free mode: show buttons */
.capsule.handsFree .capsule-btn {
  display: flex;
}

.recording-label {
  display: none;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.82);
  margin-right: 10px;
  white-space: nowrap;
}

.capsule.meeting.state-recording .recording-label {
  display: block;
}

/* Thinking state */
.thinking-container {
  display: none;
  align-items: center;
  gap: 8px;
  height: 20px;
}

.thinking-text {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 12px;
  font-weight: 500;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0.4) 0%,
    rgba(255,255,255,0.9) 40%,
    rgba(255,255,255,0.9) 60%,
    rgba(255,255,255,0.4) 100%
  );
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 2s ease-in-out infinite;
}

@keyframes shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

.progress-bar-container {
  width: 40px;
  height: 3px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 1.5px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 1.5px;
  transition: width 0.3s ease;
}

/* Recording state: show waveform, hide thinking */
.capsule.state-recording .waveform { display: flex; }
.capsule.state-recording .thinking-container { display: none; }

/* Processing state: hide waveform, show thinking */
.capsule.state-processing .waveform { display: none; }
.capsule.state-processing .thinking-container { display: flex; }
.capsule.state-processing .capsule-btn { display: none; }
</style>
</head>
<body>
<div class="capsule" id="capsule">
  <div class="capsule-row">
    <button class="capsule-btn btn-cancel" id="btnCancel" onclick="onCancel()">✕</button>
    <span class="recording-label" id="recordingLabel">Meeting</span>
    <div class="waveform" id="waveform"></div>
    <div class="thinking-container" id="thinking">
      <span class="thinking-text" id="thinkingLabel">Thinking</span>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
    <button class="capsule-btn btn-finish" id="btnFinish" onclick="onFinish()">✓</button>
  </div>
  <div class="streaming-text" id="streamingText"></div>
</div>

<script>
const NUM_BARS = 10;
const capsule = document.getElementById('capsule');
const waveform = document.getElementById('waveform');
const thinkingText = document.getElementById('thinkingLabel');
const recordingLabel = document.getElementById('recordingLabel');

const CAPSULE_TRANSLATIONS = {
  en: {
    meetingRecording: 'Meeting recording',
    transcribing: 'Transcribing',
    polishing: 'Polishing',
    meeting_transcribing: 'Generating transcript',
    meeting_summarizing: 'Generating minutes',
  },
  zh: {
    meetingRecording: '会议录制中',
    transcribing: '识别中',
    polishing: '润色中',
    meeting_transcribing: '生成逐字稿中',
    meeting_summarizing: '生成纪要中',
  },
};

let interfaceLanguage = 'en';
let currentProcessingStage = 'transcribing';

function processingStageLabel(stage) {
  const translations = CAPSULE_TRANSLATIONS[interfaceLanguage] || CAPSULE_TRANSLATIONS.en;
  return translations[stage] || translations.transcribing;
}

function setInterfaceLanguage(language) {
  interfaceLanguage = language === 'zh' ? 'zh' : 'en';
  document.documentElement.lang = interfaceLanguage === 'zh' ? 'zh-CN' : 'en';
  thinkingText.textContent = processingStageLabel(currentProcessingStage);
  recordingLabel.textContent = (CAPSULE_TRANSLATIONS[interfaceLanguage] || CAPSULE_TRANSLATIONS.en).meetingRecording;
}

// Generate waveform bars
for (let i = 0; i < NUM_BARS; i++) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  waveform.appendChild(bar);
}

const bars = waveform.querySelectorAll('.bar');
let currentState = 'hidden';
let currentMode = 'pushToTalk';
const WAVEFORM_BASE_HEIGHT = 2;
const WAVEFORM_HEIGHT_RANGE = 18;
const WAVEFORM_NOISE_FLOOR = 0.006;
const WAVEFORM_INPUT_RANGE = 0.07;
const WAVEFORM_ATTACK = 0.42;
const WAVEFORM_RELEASE = 0.14;

// Smoothed levels per bar
const smoothedLevels = new Array(NUM_BARS).fill(0);

// Latest RMS from Python (written by updateAudioLevel, read by rAF loop)
let latestRms = 0;
let rafId = null;

// Pre-compute bell curve factors (Gaussian)
const bellFactors = new Array(NUM_BARS);
const center = (NUM_BARS - 1) / 2;
for (let i = 0; i < NUM_BARS; i++) {
  const d = Math.abs(i - center) / center;
  bellFactors[i] = Math.exp(-3.5 * d * d);
}

setInterfaceLanguage('en');

function waveformDisplayLevel(rms) {
  const gated = Math.max(0, rms - WAVEFORM_NOISE_FLOOR);
  const normalized = Math.min(1.0, gated / WAVEFORM_INPUT_RANGE);
  // Keep whisper-level input visible, but let stronger syllables open up much more.
  return Math.min(1.0, normalized * (0.55 + normalized * 0.7));
}

// requestAnimationFrame render loop — 60fps smooth animation
function renderWaveform() {
  if (currentState !== 'recording') {
    rafId = null;
    return;
  }

  const displayLevel = waveformDisplayLevel(latestRms);

  for (let i = 0; i < NUM_BARS; i++) {
    const contourFactor = 0.82 + bellFactors[i] * 0.36;
    const randomFactor = 0.62 + Math.random() * (0.18 + displayLevel * 0.4);
    const targetLevel = Math.min(
      1.0,
      displayLevel * bellFactors[i] * contourFactor * randomFactor
    );

    // Smooth: rise fast, fall slow
    if (targetLevel > smoothedLevels[i]) {
      smoothedLevels[i] += (targetLevel - smoothedLevels[i]) * WAVEFORM_ATTACK;
    } else {
      smoothedLevels[i] += (targetLevel - smoothedLevels[i]) * WAVEFORM_RELEASE;
    }

    bars[i].style.height = (
      WAVEFORM_BASE_HEIGHT + smoothedLevels[i] * WAVEFORM_HEIGHT_RANGE
    ) + 'px';
  }

  rafId = requestAnimationFrame(renderWaveform);
}

function startRaf() {
  if (!rafId) {
    rafId = requestAnimationFrame(renderWaveform);
  }
}

// Progress bar state
const progressBar = document.getElementById('progressBar');
let progressTimer = null;
let progressValue = 0;

function startProgress() {
  stopProgress();
  progressValue = 0;
  progressBar.style.width = '0%';
  // Asymptotic: each tick adds a fraction of remaining distance to 90%
  progressTimer = setInterval(() => {
    const remaining = 90 - progressValue;
    progressValue += remaining * 0.35;
    progressBar.style.width = progressValue + '%';
  }, 200);
}

function stopProgress() {
  if (progressTimer) {
    clearInterval(progressTimer);
    progressTimer = null;
  }
}

/**
 * Set capsule mode: "pushToTalk", "handsFree", or "meeting"
 */
function setMode(mode) {
  currentMode = mode;
  capsule.classList.remove('pushToTalk', 'handsFree', 'meeting');
  capsule.classList.add(mode);
}

/**
 * Update capsule state: "hidden", "recording", "processing"
 */
function updateState(state) {
  currentState = state;

  // Remove previous state classes
  capsule.classList.remove('state-recording', 'state-processing');

  if (state === 'hidden') {
    capsule.classList.remove('visible', 'has-streaming-text');
    streamingText.textContent = '';
    currentProcessingStage = 'transcribing';
    thinkingText.textContent = processingStageLabel(currentProcessingStage);
    stopProgress();
    return;
  }

  capsule.classList.add('visible');
  capsule.classList.add('state-' + state);

  if (state === 'recording') {
    stopProgress();
    latestRms = 0;
    bars.forEach(bar => { bar.style.height = WAVEFORM_BASE_HEIGHT + 'px'; });
    smoothedLevels.fill(0);
    startRaf();
  } else if (state === 'processing') {
    setProcessingStage(currentProcessingStage);
    capsule.classList.remove('has-streaming-text');
    streamingText.textContent = '';
    startProgress();
  }
}

function setProcessingStage(stage) {
  currentProcessingStage = stage || 'transcribing';
  thinkingText.textContent = processingStageLabel(currentProcessingStage);
}

/**
 * Receive audio level from Python. Just store it — rAF loop reads it.
 */
function updateAudioLevel(rms) {
  latestRms = rms;
}

const streamingText = document.getElementById('streamingText');

/**
 * Show streaming text below the thinking bar during processing state.
 */
function updateStreamingText(text) {
  if (currentState !== 'processing') return;
  streamingText.textContent = text;
  if (text) {
    capsule.classList.add('has-streaming-text');
  } else {
    capsule.classList.remove('has-streaming-text');
  }
}

function onCancel() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.capsule) {
    window.webkit.messageHandlers.capsule.postMessage({action: 'cancel'});
  }
}

function onFinish() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.capsule) {
    window.webkit.messageHandlers.capsule.postMessage({action: 'finish'});
  }
}

// Initialize with default state
setMode('pushToTalk');
updateState('hidden');
</script>
</body>
</html>
