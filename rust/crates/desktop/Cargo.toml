[package]
name = "vocal-more-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license.workspace = true
description = "Rust macOS and Linux desktop host for Vocal More"
default-run = "vocal-more-desktop"

[[bin]]
name = "vocal-more-native-platform-acceptance"
path = "src/platform/tests/native_harness_entry.rs"

[[bin]]
name = "vocal-more-native-termination-acceptance"
path = "src/platform/tests/termination_harness_entry.rs"

[features]
perf-test = []
ui-test = ["gpui-kit/test-support"]

[[test]]
name = "settings_rendering"
path = "tests/settings_rendering.rs"
test = false
harness = false
required-features = ["ui-test"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
vocal-more-backend = { path = "../backend" }
vocal-more-core = { path = "../core" }
async-channel = "2.5"
futures-lite = "2.6"
gpui-kit = "=0.8.1"
regex = "1.11"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.21"
libc = "0.2"
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast", "global_shortcuts", "remote_desktop"] }
atspi-proxies = "0.13.0"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
tempfile.workspace = true

[[bin]]
name = "vocal-more-latency-fixture"
path = "src/platform/tests/latency_fixture_entry.rs"
required-features = ["perf-test"]
