[project]
name = "vocal-more"
version = "0.3.3"
description = "macOS voice recognition app with real-time ASR and text polishing"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyperclip>=1.8.2",
    "dashscope>=1.14.0",
    "chardet>=5.2.0,<6",
    "pyyaml>=6.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-WebKit>=10.0",
    "openai>=2.31.0",
]

[project.scripts]
vocal-more = "vocal_more.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocal_more"]

[tool.hatch.build.targets.editable]
packages = ["src/vocal_more"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
