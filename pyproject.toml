[project]
name = "vocal-more"
version = "0.4.3"
description = "Desktop voice recognition app for macOS and Windows with real-time ASR and text polishing"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyperclip>=1.8.2",
    "dashscope==1.25.23",
    "requests>=2.32.0",
    "pyyaml>=6.0",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
vocal-more = "vocal_more.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocal_more"]

[tool.hatch.build.targets.editable]
packages = ["src/vocal_more"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.3",
]
packaging = [
    "py2app==0.28.10; sys_platform == 'darwin'",
    "setuptools==69.5.1",
]
